# Sends the keep-alive message once a month, well inside Brevo's 90-day window.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BREVO_SMTP_LOGIN, BREVO_SMTP_KEY, MAIL_FROM, MAIL_TO
#
# Caveat: GitHub disables scheduled workflows in a repository after 60 days
# without any commit activity, and mails the owner about it. Re-enable it from
# the Actions tab, or run the script from your own cron instead.
name: keepalive

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    name: send keep-alive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send keep-alive message
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: ./brevo-keepalive.sh
